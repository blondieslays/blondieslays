<script>
  var btnStyle = "display:inline-flex;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;font-size:0.75rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:0.5rem 1.25rem;border-radius:999px;border:2px solid #FF1493;text-decoration:none;background:#ffffff;color:#FF1493;box-shadow:0 2px 8px rgba(255,20,147,0.12);line-height:1;transition:all .15s ease;";
  var btnHover = "display:inline-flex;align-items:center;justify-content:center;font-family:Montserrat,sans-serif;font-size:0.75rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;padding:0.5rem 1.25rem;border-radius:999px;border:2px solid #FF1493;text-decoration:none;background:#FF1493;color:#ffffff;box-shadow:0 6px 16px rgba(255,20,147,0.32);line-height:1;transition:all .15s ease;transform:translateY(-1px);";

  function styleBtn(el, extraStyle) {
    var s = btnStyle + (extraStyle || "");
    el.setAttribute("style", s);
    el.addEventListener("mouseenter", function() { el.setAttribute("style", btnHover + (extraStyle || "")); });
    el.addEventListener("mouseleave", function() { el.setAttribute("style", s); });
  }

  document.addEventListener("DOMContentLoaded", function() {
    // Digital Downloads nav button
    var nav = document.querySelector("ul.navbar-nav.ms-auto, nav .navbar-nav, nav ul.navbar-nav");
    if (!nav) nav = document.querySelector("nav");
    if (nav) {
      // Bulk Orders nav button
      var bulk = document.createElement("a");
      bulk.id = "bulk-nav-btn";
      bulk.href = "/team-orders/";
      bulk.textContent = "Bulk Orders";
      styleBtn(bulk, "margin-left:0.75rem;");
      nav.appendChild(bulk);

      // Shirt Designer nav button
      var designer = document.createElement("a");
      designer.id = "designer-nav-btn";
      designer.href = "/build/";
      designer.textContent = "Shirt Designer";
      styleBtn(designer, "margin-left:0.75rem;");
      nav.appendChild(designer);

      // What to Watch nav button
      var streaming = document.createElement("a");
      streaming.id = "streaming-nav-btn";
      streaming.href = "/streaming/";
      streaming.textContent = "What to Watch";
      styleBtn(streaming, "margin-left:0.75rem;");
      nav.appendChild(streaming);

      // "Meet Elise" profile chip — circular photo + name, not a filled button
      var about = document.createElement("a");
      about.id = "about-nav-btn";
      about.href = "/about/";
      about.innerHTML = '<img src="/images/me.png" alt="" />' + '<span>Meet Elise</span>';
      about.setAttribute("style", "margin-left:0.75rem;");
      nav.appendChild(about);
    }

    // Hero builder button — same style
    var heroBtn = document.querySelector('.hero-builder-btn');
    if (heroBtn) {
      styleBtn(heroBtn, "");
    }
  });
</script>
