{{ define "main" }}
<div style="max-width:1100px;margin:0 auto;padding:1.5rem 1rem 0;">
  <a href="/#custom-order" style="font-family:Montserrat,sans-serif;font-size:.8rem;font-weight:600;color:#0E93A6;text-decoration:none;">&larr; Ordering a bunch? Custom &amp; bulk orders</a>
</div>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<section class="build-showcase">
  <style>
    .build-showcase { max-width: 640px; margin: 1rem auto 0; padding: 1.5rem 1.5rem 0; text-align: center; }
    .build-showcase .bs-title { font-family:'Bebas Neue',sans-serif; letter-spacing:.03em; font-size:2.9rem; color:#FF1493; margin:0 0 .2rem; line-height:1; }
    .build-showcase .bs-sub { font-family:Montserrat,sans-serif; font-size:.95rem; color:#8a8a8a; margin:0 0 1.4rem; }
    .bs-slider { border-radius:16px; overflow:hidden; box-shadow:0 16px 36px rgba(190,24,93,.15), 0 4px 12px rgba(0,0,0,.05); }
    .bs-slider img { width:100%; height:auto; display:block; }
    .bs-slider .swiper-pagination-bullet-active { background:#FF1493; }
  </style>
  <h1 class="bs-title">Design Your Tee</h1>
  <p class="bs-sub">Real pieces, made in Sarnia &mdash; then build your own below.</p>
  <div class="bs-slider swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="/images/htv/custom-pieces.png" alt="Custom pieces"></div>
      <div class="swiper-slide"><img src="/images/htv/team-apparel.png" alt="Team apparel"></div>
    </div>
    <div class="swiper-pagination bs-dots"></div>
  </div>
</section>

{{- partial "sections/shirtbuilder.html" . -}}

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  new Swiper(".bs-slider", {
    loop: true,
    autoplay: { delay: 3500, disableOnInteraction: false },
    pagination: { el: ".bs-dots", clickable: true }
  });
});
</script>
{{ end }}
