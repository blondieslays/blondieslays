baseURL: "https://blondieslays.ca"
languageCode: "en-ca"
title: "Blondie Slays Apparel"
theme: hugo-profile

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Blondie Slays Apparel"
  description: "Custom heat-transfer vinyl apparel and bulk team merch, hand-pressed in Sarnia, Ontario. Design your own tee, order in bulk, or go one-of-a-kind."
  favicon: "/images/logo-reversed.png"

  useBootstrapCDN: false
  mathjax: false
  animate: true

  theme:
    disableThemeToggle: true
    defaultTheme: "light"

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  color:
    textColor: "#000000"
    secondaryTextColor: "#444444"
    textLinkColor: "#FF1493"
    backgroundColor: "#FFFFFF"
    secondaryBackgroundColor: "#FFE5F1"
    primaryColor: "#FF1493"
    secondaryColor: "#000000"

  navbar:
    align: ms-auto
    brandLogo: "/images/logo-reversed.png"
    showBrandLogo: true
    brandName: "Blondie Slays Apparel"
    disableSearch: true
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    enableSeparator: false
    menus:
      disableAbout: true
      disableExperience: false
      disableEducation: true
      disableProjects: true
      disableAchievements: true
      disableContact: true

  hero:
    enable: true
    intro: ""
    title: "Make it real.<br>Make it yours."
    subtitle: "Custom HTV apparel, made in Sarnia, Ontario."
    content: "Pick your colours, choose your font, and add your text — Elise will press and ship your custom tee within 48 hours. One-off pieces, team orders, and branded merch welcome."
    bottomImage:
      enable: false

  experience:
    enable: false

  projects:
    enable: true
    title: "Featured Work"
    items:
      - title: Canadian National Pickleball League
        content: End-to-end content production for league events, social media campaigns, and sponsorship activations. Blog posts, matchday graphics, promotional materials, and full brand assets across the 2026 season.
        images:
          - /images/projects/cnpl-content/cnpl-socials.png
        skills:
          - name: Content Strategy
            color: pink
          - name: Social Media
            color: blue
          - name: Sports Media
            color: mint
          - name: Graphic Design
            color: lavender

      - title: InMobi Audience Growth
        content: Increased daily pageviews by 400% and unique users by 133% through data-driven content strategy, GenAI workflows, and editorial team management across a 170-site portfolio.
        images:
          - /images/projects/inmobi-growth/03.png
        skills:
          - name: Content Strategy
            color: pink
          - name: SEO
            color: blue
          - name: Editorial Ops
            color: mint
          - name: GenAI Workflows
            color: lavender

      - title: CNPL Custom Apparel
        content: Branded merchandise production for the Canadian National Pickleball League. Custom tees, towels, and event apparel designed and produced in-studio using Cricut and heat press techniques.
        images:
          - /images/projects/cnpl-apparel/03.png
          - /images/projects/cnpl-apparel/01.png
          - /images/projects/cnpl-apparel/02.png
        link: /team-orders/
        linkText: "Get a quote for your team →"
        skills:
          - name: Custom Apparel
            color: pink
          - name: Brand Production
            color: blue
          - name: Sports Merch
            color: mint
          - name: "Cricut & HTV"
            color: lavender

  contact:
    enable: true
    title: "Get in touch"
    content: "Inbox is open for new projects, custom apparel orders, and collaborations. Based in Sarnia, Ontario, working with clients across Canada and beyond. Ordering for a team, league, or business? [Get a bulk quote here](/team-orders/) instead."
    btnName: "Email Elise"
    btnLink: "mailto:blondieslaysapparel@gmail.com"

  footer:
    socialNetworks:
      linkedin: https://linkedin.com/in/elisemarion
      instagram: https://www.instagram.com/blondieslays/
      etsy: https://www.etsy.com/shop/BlondieSlaysApparel
      facebook: https://www.facebook.com/blondieslays/

  listPages:
    disableFeaturedImage: false

  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

